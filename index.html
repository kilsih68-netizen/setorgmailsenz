<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SENZ GMAIL — Platform Setor Gmail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{-webkit-appearance:none;appearance:none;background:0;border:0;color:inherit;font:inherit;font-family:inherit;cursor:pointer;padding:0;margin:0;text-align:center;-webkit-tap-highlight-color:transparent;outline:none}
:root{--bg:#f4f6fb;--line:#e2e8f0;--txt:#0f172a;--muted:#64748b;--blue:#3b82f6;--blue-dark:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--wa:#25D366;--tg:#229ED9;--r:16px;--drawer-w:296px;--bnav-h:74px;--gold:#d4a017;--silver:#94a3b8;--bronze:#b45309}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;font-weight:500;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 500px at 50% -10%,rgba(59,130,246,.07),transparent 65%),radial-gradient(700px 500px at 100% 100%,rgba(124,92,255,.05),transparent 60%)}
#app{position:relative;z-index:1;min-height:100vh}
h1,h2,h3,h4{font-weight:800;letter-spacing:-.01em;color:#0f172a}
h2{font-size:20px}h3{font-size:15.5px}
.brand{font-weight:800;letter-spacing:.4px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:#64748b}
.muted{color:var(--muted)}.small{font-size:12.5px}
strong,b{font-weight:700}
.field{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:800;color:#334155;margin-bottom:7px;letter-spacing:.3px}
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]):not([type="submit"]):not([type="button"]):not([type="reset"]),select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background-color:#fff;color:var(--txt);font-size:13.5px;font-family:inherit;outline:none;transition:.16s;-webkit-appearance:none;appearance:none;font-weight:600}
textarea{resize:vertical;min-height:90px;line-height:1.65}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
input::placeholder,textarea::placeholder{color:#94a3b8;font-weight:500}
select{background-image:linear-gradient(45deg,transparent 50%,#64748b 50%),linear-gradient(135deg,#64748b 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px;background-color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background-color:#fff;color:#0f172a;font-weight:800;font-size:13.5px;font-family:inherit;transition:.16s;white-space:nowrap;letter-spacing:.2px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.btn:hover{transform:translateY(-1px);border-color:#cbd5e1;box-shadow:0 4px 10px rgba(15,23,42,.06)}
.btn:active{transform:translateY(0)}
.btn.primary{background-color:transparent;background-image:linear-gradient(135deg,var(--blue),var(--blue-dark));border-color:transparent;color:#fff;box-shadow:0 14px 30px -16px rgba(59,130,246,.7)}
.btn.ok{background-color:transparent;background-image:linear-gradient(135deg,#16a34a,#22c55e);border-color:transparent;color:#fff;box-shadow:0 14px 30px -16px rgba(34,197,94,.6)}
.btn.bad{background-color:transparent;background-image:linear-gradient(135deg,#dc2626,#ef4444);border-color:transparent;color:#fff;box-shadow:0 14px 30px -16px rgba(239,68,68,.6)}
.btn.warn{background-color:transparent;background-image:linear-gradient(135deg,#d97706,#f59e0b);border-color:transparent;color:#fff;box-shadow:0 14px 30px -16px rgba(245,158,11,.6)}
.btn.ghost{background-color:transparent;background-image:none;border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%;margin-top:6px}
.btn svg{flex:none}
.rowbetween{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.note{border-radius:12px;padding:12px 14px;font-size:12.8px;line-height:1.65;border:1px solid var(--line);background:#f8fafc;color:#334155;margin-bottom:16px;font-weight:500}
.note.warn{border-color:rgba(245,158,11,.35);background:#fffbeb;color:#92400e}
.note.bad{border-color:rgba(239,68,68,.35);background:#fef2f2;color:#991b1b}
.note.ok{border-color:rgba(34,197,94,.35);background:#f0fdf4;color:#166534}
.note.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:6px;text-align:center;color:#0f172a;font-weight:800}
.auth-page{position:relative;min-height:100vh;background:#ffffff;display:flex;flex-direction:column;align-items:center;padding:40px 20px;overflow:hidden}
.auth-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(59,130,246,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.05) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle at 50% 25%,#000,#000 35%,transparent 72%);-webkit-mask-image:radial-gradient(circle at 50% 25%,#000,#000 35%,transparent 72%)}
.auth-glow{position:absolute;top:-180px;left:50%;transform:translateX(-50%);width:820px;height:820px;pointer-events:none;background:radial-gradient(circle,rgba(59,130,246,.15),rgba(59,130,246,.03) 38%,transparent 65%);filter:blur(2px)}
.auth-content{position:relative;z-index:2;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;animation:authIn .55s cubic-bezier(.2,.7,.3,1) both}
@keyframes authIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.auth-logo-wrap{position:relative;width:140px;height:140px;margin-bottom:22px;display:grid;place-items:center}
.auth-logo-ring{position:absolute;inset:-15px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.3),rgba(59,130,246,.05) 40%,transparent 70%);animation:authGlow 3.4s ease-in-out infinite;pointer-events:none}
.auth-logo-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid rgba(59,130,246,.3);animation:authPulse 3.4s ease-out infinite}
@keyframes authGlow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes authPulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.auth-logo{width:120px;height:120px;border-radius:50%;overflow:hidden;position:relative;z-index:1;box-shadow:0 0 0 5px rgba(255,255,255,.95),0 0 40px 8px rgba(59,130,246,.35),0 25px 50px -15px rgba(15,23,42,.25);display:grid;place-items:center;background:linear-gradient(160deg,#3b82f6,#1d4ed8);animation:logoFloat 3.5s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.03)}}
.auth-logo svg{width:100%;height:100%;display:block}
.auth-logo img{width:100%;height:100%;display:block;object-fit:cover}
.auth-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:999px;background:linear-gradient(180deg,rgba(59,130,246,.1),rgba(59,130,246,.05));border:1.5px solid rgba(59,130,246,.25);color:#1d4ed8;font-size:12.5px;font-weight:800;letter-spacing:.6px;margin-bottom:18px;box-shadow:0 6px 22px -10px rgba(59,130,246,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.auth-badge svg{color:#2563eb;flex:none}
.auth-title{font-size:42px;font-weight:900;letter-spacing:-.03em;color:#0f172a;line-height:1;margin-bottom:10px;text-align:center;text-shadow:0 6px 30px rgba(59,130,246,.15)}
.auth-title .accent{background:linear-gradient(135deg,#3b82f6,#2563eb 60%,#1d4ed8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(59,130,246,.4))}
.auth-sub{font-size:12.5px;color:#64748b;font-weight:800;letter-spacing:2.5px;margin-bottom:26px;text-align:center;text-transform:uppercase}
.auth-sub .dot{color:#3b82f6;margin:0 7px;font-weight:900;opacity:.7}
.auth-card{width:100%;background:linear-gradient(180deg,#ffffff,#fafbff);border:1px solid #e2e8f0;border-radius:28px;padding:26px 22px;box-shadow:0 30px 80px -34px rgba(15,23,42,.18),0 0 60px -28px rgba(59,130,246,.2),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(12px);position:relative}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:14px;padding:5px;margin-bottom:22px;position:relative}
.atab{padding:11px;border:0;border-radius:10px;background-color:transparent;color:#64748b;font-weight:800;font-size:13.5px;font-family:inherit;cursor:pointer;transition:.22s;letter-spacing:.2px}
.atab.on{background-image:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 10px 26px -12px rgba(59,130,246,.7),inset 0 1px 0 rgba(255,255,255,.22)}
.atab:hover:not(.on){color:#1e293b}
.afield{margin-bottom:16px}
.afield label{display:block;font-size:12.5px;font-weight:800;color:#334155;margin-bottom:8px;letter-spacing:.25px}
.ainput-wrap{position:relative;display:flex;align-items:center;border-radius:12px;background:#fff;border:1px solid #e2e8f0;transition:.18s}
.ainput-wrap:focus-within{border-color:rgba(59,130,246,.55);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.12),0 0 26px -8px rgba(59,130,246,.5)}
.ainput-wrap .lead{flex:none;padding:0 4px 0 14px;display:grid;place-items:center;color:#94a3b8;transition:.16s}
.ainput-wrap:focus-within .lead{color:#2563eb}
.ainput-wrap input{flex:1;width:100%;padding:13px 12px;background:transparent;border:0;color:#0f172a;font-size:14px;font-family:inherit;font-weight:600;outline:none;min-width:0;box-shadow:none!important;border-radius:0!important}
.ainput-wrap input::placeholder{color:#94a3b8;font-weight:500}
.ainput-wrap .trail{flex:none;padding:0 12px 0 4px;display:grid;place-items:center}
.ainput-icon-btn{background-color:transparent;border:0;padding:6px;border-radius:8px;cursor:pointer;color:#94a3b8;transition:.16s;display:grid;place-items:center;font-family:inherit}
.ainput-icon-btn:hover{color:#1e293b;background:rgba(59,130,246,.1)}
.arobot{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:#fff;border:1px solid #e2e8f0;cursor:pointer;transition:.18s;margin-bottom:16px;user-select:none}
.arobot:hover{border-color:rgba(59,130,246,.4)}
.arobot.checked{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.05);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.arobot-box{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid #cbd5e1;background:#f8fafc;display:grid;place-items:center;transition:.16s;color:transparent}
.arobot.checked .arobot-box{background:linear-gradient(135deg,#3b82f6,#60a5fa);border-color:#60a5fa;color:#fff;box-shadow:0 0 12px rgba(96,165,250,.4)}
.arobot-label{flex:1;font-size:13.5px;font-weight:700;color:#334155;letter-spacing:.2px}
.arobot-shield{color:#94a3b8;flex:none}
.arobot.checked .arobot-shield{color:#2563eb}
.abtn{width:100%;padding:15px 20px;border-radius:14px;border:0;background-color:transparent;background-image:linear-gradient(135deg,#3b82f6 0%,#2563eb 50%,#1d4ed8 100%);background-size:200% auto;color:#fff;font-family:inherit;font-size:14.5px;font-weight:800;letter-spacing:.3px;cursor:pointer;transition:all .35s ease;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 40px -12px rgba(59,130,246,.85),inset 0 1px 0 rgba(255,255,255,.3);margin-top:4px}
.abtn:not(.google):hover{background-position:right center;box-shadow:0 22px 55px -12px rgba(59,130,246,1);transform:translateY(-2px)}
.abtn:active{transform:translateY(0)}
.abtn.google{background-image:none;background-color:#fff;color:#0f172a;border:1.5px solid #e2e8f0;box-shadow:0 1px 3px rgba(15,23,42,.06);margin-bottom:0}
.abtn.google:hover{border-color:#cbd5e1;background:#f8fafc;transform:translateY(-1px)}
.abtn.google svg{width:20px;height:20px;flex:none}
.auth-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#94a3b8;font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:#e2e8f0}
.alink{color:#2563eb;font-weight:800;cursor:pointer;background-color:transparent;border:0;font-family:inherit;font-size:12.5px;padding:0;letter-spacing:.2px}
.alink:hover{text-decoration:underline}
.arow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.anote{border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.65;border:1px solid #e2e8f0;background:#f8fafc;color:#334155;margin-bottom:14px;font-weight:500}
.anote.warn{border-color:rgba(245,158,11,.35);background:#fffbeb;color:#92400e}
.anote.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:6px;text-align:center;color:#0f172a;font-weight:800}
.shell{min-height:100vh;display:flex;flex-direction:column;position:relative}
.topbar{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);max-width:900px;margin:0 auto;width:100%}
.hamburger{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background-color:#fff;background-image:linear-gradient(180deg,#ffffff,#f1f5f9);cursor:pointer;transition:.18s;padding:0}
.hamburger:hover{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.hamburger .bars{display:flex;flex-direction:column;gap:4px}
.hamburger .bars span{display:block;width:18px;height:2px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--blue-dark));transition:.24s}
.hamburger.active .bars span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.hamburger.active .bars span:nth-child(2){opacity:0}
.hamburger.active .bars span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.topbar .brand{display:flex;align-items:center;gap:9px;font-size:16.5px;font-weight:900;letter-spacing:-.01em;margin-right:auto;min-width:0;flex:1;color:#0f172a}
.topbar .brand .mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;overflow:hidden;background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 8px 20px -8px rgba(59,130,246,.6)}
.topbar .brand .mark svg{width:100%;height:100%;display:block}
.topbar .brand .mark img{width:100%;height:100%;display:block;object-fit:cover}
.topbar .brand .brandtext{display:inline-flex;align-items:center;font-weight:900;letter-spacing:-.01em;font-size:16.5px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand .hl{background:linear-gradient(90deg,#3b82f6,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.topbar-action{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:#475569;cursor:pointer;transition:.16s}
.topbar-action:hover{border-color:#cbd5e1;color:#0f172a;background:rgba(59,130,246,.06)}
.main{flex:1;padding:16px 16px calc(var(--bnav-h) + 30px + env(safe-area-inset-bottom));max-width:900px;width:100%;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.03)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.card-head h3{margin:0;display:flex;align-items:center;gap:10px;font-size:15px}
.card h3{display:flex;align-items:center;gap:9px;font-size:15px;margin-bottom:12px}
.dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#60a5fa);flex:none}
.ic-dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(96,165,250,.1));border:1px solid rgba(59,130,246,.3);color:#1d4ed8}
.pad{padding:28px}.center{text-align:center}
.profile-hero{position:relative;overflow:hidden;background:radial-gradient(600px 240px at 50% 0%,rgba(59,130,246,.18),transparent 70%),linear-gradient(180deg,#dbeafe,#eff6ff);border:1px solid rgba(59,130,246,.25);border-radius:20px;padding:26px 20px 22px;margin-bottom:14px;text-align:center}
.profile-avatar-wrap{position:relative;width:110px;height:110px;margin:0 auto 14px;z-index:1}
.profile-avatar{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#3b82f6,#1d4ed8);color:#fff;font-weight:900;font-size:44px;overflow:hidden;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 26px 4px rgba(59,130,246,.3),0 18px 40px -18px rgba(15,23,42,.2);border:3px solid #fff}
.profile-avatar img{width:100%;height:100%;display:block;object-fit:cover}
.profile-photo-btn{position:absolute;right:0;bottom:4px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:3px solid #fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px -8px rgba(59,130,246,.7);transition:.16s}
.profile-name{font-size:22px;font-weight:900;color:#0f172a;letter-spacing:-.02em;position:relative;z-index:1}
.profile-email{font-size:13px;color:#334155;font-weight:600;margin-top:3px;position:relative;z-index:1;word-break:break-all}
.profile-actions{display:flex;gap:8px;justify-content:center;margin-top:14px;position:relative;z-index:1;flex-wrap:wrap}
.profile-actions .btn{background-color:rgba(255,255,255,.7);border-color:rgba(59,130,246,.25);color:#1d4ed8}
.saldo-card{position:relative;overflow:hidden;background:radial-gradient(600px 220px at 100% 0%,rgba(59,130,246,.1),transparent 60%),radial-gradient(500px 200px at 0% 100%,rgba(59,130,246,.06),transparent 65%),linear-gradient(180deg,#ffffff,#f8fafc);border:1px solid rgba(59,130,246,.2);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.03)}
.saldo-card .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.saldo-card .label{display:flex;align-items:center;gap:9px;color:#334155;font-size:13.5px;font-weight:700;letter-spacing:.15px}
.saldo-card .label svg{color:#2563eb;flex:none}
.saldo-card .arrow-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2563eb);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 10px 22px -10px rgba(59,130,246,.75);transition:.16s;cursor:pointer}
.saldo-card .amount{font-size:32px;font-weight:900;letter-spacing:-.02em;color:#0f172a;line-height:1.1;margin-bottom:14px}
.saldo-card .chips{display:flex;gap:8px;flex-wrap:wrap}
.schip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;font-size:12px;font-weight:800;letter-spacing:.2px;border:1px solid transparent}
.schip svg{flex:none}
.schip.blue{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.25);color:#1d4ed8}
.schip.green{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.25);color:#15803d}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;min-height:78px;box-shadow:0 1px 3px rgba(15,23,42,.03)}
.stat-box .icon{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);color:#2563eb}
.stat-box .body{min-width:0;flex:1}
.stat-box .lbl{font-size:11.5px;color:#64748b;font-weight:700;letter-spacing:.2px;margin-bottom:2px;text-transform:none}
.stat-box .val{font-size:15.5px;font-weight:800;color:#0f172a;letter-spacing:-.01px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chan-btn{padding:18px 12px;border-radius:16px;background:#f8fafc;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:.18s;font-family:inherit}
.chan-btn:hover{border-color:#cbd5e1;background:rgba(59,130,246,.04);transform:translateY(-2px)}

function userBalance(email){const earned=deps().filter(d=>d.userEmail===email&&d.status==='approved').reduce((a,d)=>a+(Number(d.paid)||0),0);const out=wds().filter(w=>w.userEmail===email&&w.status!=='rejected').reduce((a,w)=>a+(Number(w.amount)||0),0);return earned-out}
function checkBalanceImpact(ids){const all=deps();const idSet=new Set(ids);const sumByUser={};all.forEach(d=>{if(idSet.has(d.id)&&d.status==='approved')sumByUser[d.userEmail]=(sumByUser[d.userEmail]||0)+(Number(d.paid)||0)});const blocked=[];for(const email in sumByUser){const bal=userBalance(email);const impact=sumByUser[email];if(bal-impact<0)blocked.push({email,bal,impact,after:bal-impact})}return blocked}

function compressImage(file,maxDim,quality){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{try{let w=img.naturalWidth||img.width;let h=img.naturalHeight||img.height;if(!w||!h)throw new Error('invalid');if(w>maxDim||h>maxDim){const r=Math.min(maxDim/w,maxDim/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))}catch(err){reject(err)}};img.onerror=()=>reject(new Error('img'));img.src=e.target.result};reader.onerror=()=>reject(new Error('read'));reader.readAsDataURL(file)})}

function pageSetor(u){const s=settings();const isFree=getUserDepositMode(u.email)==='free';const myPool=stock().filter(x=>x.takenBy===u.email&&x.status==='taken');const myDeposited=deps().filter(d=>d.userEmail===u.email).map(d=>d.gmail.toLowerCase());const readyPool=myPool.filter(x=>!myDeposited.includes(x.gmail.toLowerCase()));const depositOpen=s.depositOpen;const modeBanner=isFree?`<div class="note ok">${icon('check',16)} <b>Setor Bebas</b> — gmail apa saja boleh.</div>`:`<div class="note warn">${icon('shield',16)} <b>Hanya Generate</b> — wajib generate dulu.</div>`;const generateCard=isFree?`<div class="card" style="background:linear-gradient(120deg,rgba(59,130,246,.06),rgba(34,211,238,.03));border-color:rgba(59,130,246,.2)"><h3><span class="ic-dot">${icon('sparkle',14)}</span>Generate <span style="font-size:11px;color:#64748b;margin-left:auto">(opsional)</span></h3><div class="flexrow" style="gap:10px"><input type="number" id="genQty" placeholder="Jumlah" min="1" max="9999" style="flex:1;min-width:140px"><button class="btn primary" data-act="do-generate">${icon('zap',15)} Generate</button></div></div>`:`<div class="card" style="background:linear-gradient(120deg,rgba(59,130,246,.08),rgba(34,211,238,.04));border-color:rgba(59,130,246,.25)"><h3><span class="step-badge">1</span> Generate Gmail</h3><div class="flexrow" style="gap:10px"><input type="number" id="genQty" placeholder="Jumlah" min="1" max="9999" style="flex:1;min-width:140px"><button class="btn primary" data-act="do-generate">${icon('zap',15)} Generate</button></div></div>`;const listCard=`<div class="card"><div class="card-head"><h3>${isFree?'':`<span class="step-badge">2</span> `}Gmail Anda (${readyPool.length})</h3>${readyPool.length?`<div class="flexrow"><button class="btn sm" data-act="copy-all-my-pool">${icon('copy',13)} Salin</button><button class="btn sm primary" data-act="fill-my-pool">${icon('zap',13)} Isi Otomatis</button></div>`:''}</div>${readyPool.length?`<div>${readyPool.map(it=>`<div class function pageLaporan(u){const all=deps().filter(d=>d.userEmail===u.email).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));const f=state.reportFilter;const list=f==='all'?all:all.filter(d=>d.status===f);const count=st=>all.filter(d=>d.status===st).length;const chips=`<div class="chipbar"><button class="chip ${f==='all'?'on':''}" data-act="rfilter" data-f="all">Semua <span class="cnt">${all.length}</span></button><button class="chip ${f==='approved'?'on':''}" data-act="rfilter" data-f="approved">Disetujui <span class="cnt">${count('approved')}</span></button><button class="chip ${f==='rejected'?'on':''}" data-act="rfilter" data-f="rejected">Ditolak <span class="cnt">${count('rejected')}</span></button><button class="chip ${f==='pending'?'on':''}" data-act="rfilter" data-f="pending">Pending <span class="cnt">${count('pending')}</span></button></div>`;const items=list.length?list.map(d=>{const badge=d.status==='approved'?`<span class="badge ok">${icon('check',11)} Disetujui</span>`:d.status==='rejected'?`<span class="badge bad">${icon('xmark',11)} Ditolak</span>`:`<span class="badge warn">${icon('hourglass',11)} Pending</span>`;const delBtn=d.status==='approved'?'':`<button class="del-btn sm" data-act="del-dep" data-id="${esc(d.id)}">${icon('trash',13)}</button>`;const rb=d.status==='rejected'&&d.reason?`<div style="font-size:11.5px;color:#991b1b;background:#fef2f2;border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:7px 10px;margin-top:6px"><b>Alasan:</b> ${esc(d.reason)}</div>`:'';const paidTag=(d.status==='approved'&&Number(d.paid)>0)?`<span style="font-size:10.5px;color:#15803d;font-weight:800;background:#f0fdf4;border:1px solid rgba(34,197,94,.3);padding:2px 7px;border-radius:6px">+${rupiah(d.paid)}</span>`:'';return `<div style="padding:10px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="gen-email" style="flex:1;min-width: r-wa">${icon('xmark',14)} Hapus</button>`:''}</div></div><div class="card" style="background:linear-gradient(120deg,rgba(34,158,217,.08),rgba(59,130,246,.04));border-color:rgba(34,158,217,.25)"><h3><span class="ic-dot" style="background:rgba(34,158,217,.15);border-color:rgba(34,158,217,.4);color:#229ED9">${tgIcon(14)}</span>Channel Telegram</h3><div class="field"><label>Username / Link</label><input id="setTgLink" type="text" placeholder="@username atau https://t.me/namachannel" value="${esc(s.telegramLink)}"></div><div class="flexrow"><button class="btn primary" data-act="save-tg">${icon('check',16)} Simpan</button>${tgValid?`<a class="btn ok" href="${esc(normalizeTgLink(s.telegramLink))}" target="_blank" rel="noopener noreferrer">${tgIcon(15)} Test</a>`:''}${s.telegramLink?`<button class="btn ghost sm" data-act="clear-tg">${icon('xmark',14)} Hapus</button>`:''}</div></div><div class="card"><h3><span class="ic-dot">${icon('key',14)}</span>Daftar Password</h3><p class="muted small mb">Matikan password untuk menyembunyikan tanpa hapus. Pending tetap bisa di-approve.</p>${pwRows}<div class="divider"></div><div class="field"><label>Label</label><input type="text" id="newPwLabel" placeholder="cth: Password 3"></div><div class="field"><label>Isi Password</label><input type="text" id="newPwValue" placeholder="cth: SenzGmail#03"></div><button class="btn primary" data-act="add-pw">${icon('plus',16)} Tambah Password</button></div>`}
function parseGmailLines(text){const lines=String(text||'').split(/[\n,;]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);const valid=[],invalid=[];const seen=new Set();for(const l of lines){if(!isGmail(l)){invalid.push(l);continue}if(seen.has(l))continue;seen.add(l);valid.push(l)}return{valid,invalid}}
function parseRekapLines(text){return String(text||'').split(/[\n,;\s]+/).map(s=>s.trim().toLowerCase()).filter(s=>s&&isGmail(s))}
function updateDepositCounter(text){const pill=$('depCountPill');const cntEl=$('depCount');const invEl=$('depInvalid');if(!pill||!cntEl||!invEl)return;const{valid,invalid}=parseGmailLines(text);cntEl.textContent=valid.length;pill.classList.remove('ok','bad');if(valid.length>0)pill.classList.add('ok');else if(text.trim().length>0)pill.classList.add('bad');if(invalid.length){invEl.classList.add('show');invEl.innerHTML='<b>Tidak valid:</b><br>'+invalid.map(v=>`<code>${esc(v)}</code>`).join('')}else{invEl.classList.remove('show');invEl.innerHTML=''}}

    const {data:{session}}=await sb.auth.getSession();
    if(session&&session.user&&session.user.email){
      const email=session.user.email.toLowerCase();
      const fbName=session.user.user_metadata?.full_name||email.split('@')[0];
      const fbPhoto=session.user.user_metadata?.avatar_url||'';
      await loadAll();
      let u=_cache.users.find(x=>x.email.toLowerCase()===email);
      if(u&&u.blocked===true){await sb.auth.signOut();alert('AKUN DIBLOKIR\n\nAlasan: '+(u.blockReason||'Melanggar peraturan'));$('app').innerHTML=renderAuth();return}
      if(!u){const nu={id:uid(),nickname:fbName.slice(0,20),email,password:'__google__',photo:fbPhoto,bank:{...DEFAULT_BANK},createdAt:new Date().toISOString(),provider:'google',depositMode:'inherit'};await sbSaveUser(nu);_cache.users.push(nu);u=nu;toast('Akun baru via Google','ok')}
      else if(u.provider!=='google'){const idx=_cache.users.findIndex(x=>x.email.toLowerCase()===email);if(idx>=0){const nu={..._cache.users[idx],provider:'google',photo:u.photo||fbPhoto};await sbSaveUser(nu);_cache.users[idx]=nu;u=nu}}
      put(K.sess,u.email);put(K.adm,false);state.userEmail=u.email;state.view='user';state.userPage='dashboard';state.drawerOpen=false;state.waPopupShown=false;newCaptcha();startRealtime();render();setTimeout(triggerWaPopupOnce,400);toast('Berhasil masuk via Google! Halo '+u.nickname,'ok');return;
    }
  }catch(err){console.warn('[GOOGLE CALLBACK]',err)}
  const admSession=get(K.adm,false);const sess=get(K.sess,null);
  newCaptcha();
  $('app').innerHTML='<div style="display:grid;place-items:center;min-height:100vh;font-family:Inter,sans-serif;color:#64748b;font-size:14px;font-weight:600;gap:14px;flex-direction:column"><div style="width:44px;height:44px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite"></div><div>Menghubungkan ke server...</div><style>@keyframes spin{to{transform:rotate(360deg)}}</style></div>';
  await loadAll();
  if(admSession===true){state.view='admin';state.adminPage='dashboard'}
  else if(sess){const u=_cache.users.find(x=>x.email===sess);if(u&&!u.blocked){state.view='user';state.userEmail=u.email;state.userPage='dashboard';setTimeout(triggerWaPopupOnce,600)}else{put(K.sess,null);state.view='auth'}}
  else{state.view='auth'}
  startRealtime();
  render();
})();
</script>
</body>
</html>
